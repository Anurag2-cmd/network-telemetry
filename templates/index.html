<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Telemetry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 16px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 14px; text-align: center; }
        .card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 1.4rem; font-weight: 600; margin-top: 4px; }
        .card .value.down { color: #f87171; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .chart-box { background: #1e293b; border-radius: 10px; padding: 14px; }
        .chart-box.full { grid-column: 1 / -1; }
        .chart-box h2 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; }
        canvas { max-height: 220px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 500; }
        .status-ok { color: #4ade80; }
        .status-bad { color: #f87171; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>Network Telemetry</h1>

    <div class="cards">
        <div class="card"><div class="label">Gateway latency</div><div class="value" id="gw-latency">—</div></div>
        <div class="card"><div class="label">Packet loss</div><div class="value" id="loss">—</div></div>
        <div class="card"><div class="label">CPU</div><div class="value" id="cpu">—</div></div>
        <div class="card"><div class="label">Memory</div><div class="value" id="mem">—</div></div>
        <div class="card"><div class="label">Download</div><div class="value" id="down">—</div></div>
        <div class="card"><div class="label">Upload</div><div class="value" id="up">—</div></div>
    </div>

    <div class="grid">
        <div class="chart-box full">
            <h2>Latency over time (ms)</h2>
            <canvas id="latency-chart"></canvas>
        </div>
        <div class="chart-box">
            <h2>CPU & Memory (%)</h2>
            <canvas id="cpu-chart"></canvas>
        </div>
        <div class="chart-box">
            <h2>Network speed (MB/s)</h2>
            <canvas id="net-chart"></canvas>
        </div>
    </div>

    <script>
        const labels = (data) => data.map(d => new Date(d.ts * 1000).toLocaleTimeString());

        function lineChart(id, data, keys, colors) {
            const existing = Chart.getChart(id);
            if (existing) existing.destroy();
            const datasets = keys.map((key, i) => ({
                label: key.replace(/_/g, ' '),
                data: data.map(d => d[key]),
                borderColor: colors[i],
                backgroundColor: colors[i] + '22',
                borderWidth: 1.5,
                tension: 0.3,
                pointRadius: 0,
                fill: false,
            }));
            new Chart(document.getElementById(id), {
                type: 'line',
                data: { labels: labels(data), datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: {
                        x: { ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                    },
                },
            });
        }

        function render(data) {
            if (data.length === 0) return;
            const last = data[data.length - 1];

            document.getElementById('gw-latency').textContent = last.gw_latency != null ? last.gw_latency.toFixed(1) + ' ms' : 'DOWN';
            document.getElementById('loss').textContent = (last.gw_loss || 0).toFixed(0) + '%';
            document.getElementById('cpu').textContent = last.cpu.toFixed(0) + '%';
            document.getElementById('mem').textContent = last.mem.toFixed(0) + '%';
            document.getElementById('down').textContent = last.net_down.toFixed(2) + ' MB/s';
            document.getElementById('up').textContent = last.net_up.toFixed(2) + ' MB/s';

            const lossPct = last.gw_loss || 0;
            const bad = lossPct > 0 || last.gw_latency == null;
            document.getElementById('gw-latency').className = 'value' + (bad ? ' down' : '');
            document.getElementById('loss').className = 'value' + (bad ? ' down' : '');

            lineChart('latency-chart', data, ['gw_latency', 'dns_latency'], ['#38bdf8', '#a78bfa']);
            lineChart('cpu-chart', data, ['cpu', 'mem'], ['#fbbf24', '#34d399']);
            lineChart('net-chart', data, ['net_down', 'net_up'], ['#4ade80', '#fb923c']);
        }

        async function refresh() {
            try {
                const res = await fetch('/api/data');
                render(await res.json());
            } catch (e) {
                console.error('Failed to load data', e);
            }
        }

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
